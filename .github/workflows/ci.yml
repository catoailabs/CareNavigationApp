name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Create Python virtualenv
        run: python -m venv .venv

      - name: Install Python dependencies
        run: |
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install -r requirements-ci.txt

      - name: Python unit tests
        run: ./.venv/bin/python -m unittest discover -s tests -v

  submodules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Verify submodules are initialized
        shell: bash
        run: |
          status="$(git submodule status --recursive)"
          printf '%s\n' "$status"
          if printf '%s\n' "$status" | grep -q '^-'; then
            echo "::error::Found uninitialized submodules." >&2
            exit 1
          fi

      - name: Verify expected submodule count
        shell: bash
        run: |
          count="$(git submodule status | wc -l | tr -d ' ')"
          echo "Found $count submodule(s)"
          if [ "$count" -ne 7 ]; then
            echo "::error::Expected 7 submodules, found $count"
            exit 1
          fi

      - name: Verify submodule directories are non-empty
        shell: bash
        run: |
          for dir in tools/mcp/*/; do
            if [ -z "$(ls -A "$dir")" ]; then
              echo "::error::Submodule $dir is empty"
              exit 1
            fi
          done
