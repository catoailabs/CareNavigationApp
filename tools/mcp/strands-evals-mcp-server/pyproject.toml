[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strands-evals-mcp-server"
version = "0.1.0"
description = "MCP Server for Strands Evals SDK - ActorSimulator and ExperimentGenerator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
strands-evals-mcp-server = "strands_evals_mcp_server.server:mcp.run"
