# Reverse proxy — unified entry point for all healthcare services
# Access pattern:
#   http://<host>:8080/             → OHIF Viewer
#   http://<host>:8080/orthanc/     → Orthanc REST API + DICOMweb
#   http://<host>:8080/openemr/     → OpenEMR EHR
#   http://<host>:8080/dicom-web/   → DICOMweb direct

server {
    listen 8080;
    server_name _;

    client_max_body_size 500M;  # DICOM files can be large

    # CORS headers for all responses
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;

    # OHIF Viewer (default)
    location / {
        proxy_pass http://ohif:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Orthanc REST API + Web UI
    location /orthanc/ {
        rewrite /orthanc(.*) $1 break;
        proxy_pass http://orthanc:8042;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # DICOMweb direct access (proxied to Orthanc DICOMweb plugin)
    location /dicom-web/ {
        proxy_pass http://orthanc:8042/dicom-web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # WADO-URI
    location /wado {
        proxy_pass http://orthanc:8042/wado;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # OpenEMR
    location /openemr/ {
        proxy_pass http://openemr:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Override OpenEMR's anti-framing defaults for same-origin iframe embedding.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }
}
