                    type: array
                    items:
                      type: string
                  allowedCORSOriginsUrls:
                    type: array
                    items:
                      type: string
                  passwordlessSMS:
                    type: boolean
                  mfaEnabled:
                    type: boolean
                  shouldSendInviteEmail:
                    type: boolean
                  logoUri:
                    type: string
                  refreshTokenEnabled:
                    type: boolean
              example:
                clientId: 5a8fd1ea-8d37-ea92-aed8-5c5a130fc812
                id: ef35dace-1a25-41d1-a248-79fe59f15b56
                name: ex
