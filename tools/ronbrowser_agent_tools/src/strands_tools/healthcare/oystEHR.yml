                  email:
                    type: string
                  practitionerId:
                    type: string
                    format: uri
                  invitationUrl:
                    type: string
                    format: uri
                  roles:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
