                email: <string>
                practitionerId: urn:uuid:6f85b04f-8985-12f7-21a8-aeb1a8dd9650
                invitationUrl: urn:uuid:33bc13e2-9c82-5d40-fd55-affb3236dc42
                roles:
                  - id: 05d59f29-55c5-97d5-d056-b5a5a5ad5377
                    name: aliqua
                  - id: 35a9ce88-8aca-1303-cf2d-85be8161c914
                    name: adipisicing laborum reprehenderit nostrud
      tags:
        - ZapEHR Project API
        - developer
      description: >-
        Invite a new Developer to the Project. Developer accounts are used to
        log into the [Developer Console](https://console.oystehr.com/) and
        administrate [Projects](https://docs.oystehr.com/services/project/).
        [Developers](https://docs.oystehr.com/services/iam/developers/) are the
        only people who can belong to and act across multiple Projects, because
        they exist above the Project level.


        Access Policy Action: `IAM:InviteDeveloper`

        Access Policy Resource: `IAM:Developer`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                practitioner:
                  type: string
                roles:
                  type: array
                  items:
                    type: string
                accessPolicy:
                  type: object
                  properties:
                    rule:
                      type: array
                      items:
                        type: object
                        properties:
                          resource:
                            type: array
                            items:
                              type: string
                          action:
                            type: array
                            items:
                              type: string
                          effect:
                            type: string
            example:
              email: <string>
              practitioner: <object>
              roles:
                - <uuid>
                - <uuid>
              accessPolicy:
                rule:
                  - resource:
                      - <string>
                      - <string>
                    action:
                      - <string>
                      - <string>
                    effect: <string>
                  - resource:
                      - <string>
                      - <string>
                    action:
                      - <string>
                      - <string>
                    effect: <string>
  /m2m/{id}:
