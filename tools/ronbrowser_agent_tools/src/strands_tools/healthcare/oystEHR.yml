  /developer/{id}:
    get:
      summary: Get a developer by ID
      parameters:
        - name: x-zapehr-project-id
          in: header
          schema:
            type: string
          example: '{{projectId}}'
      responses:
        '200':
          description: Developer
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  email:
                    type: string
                  profile:
                    type: string
                  roles:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
              example:
                id: 86be5dcd-eba3-c69a-e47e-8ab421b89fe0
                name: qui incididunt
                email: non do officia Ut in
                profile: Lorem consequat nulla laboris culpa
                roles:
                  - id: e84f5591-0156-d3ec-88eb-95bbd1b7923e
                    name: mollit
                  - id: urn:uuid:44376558-8a0b-39b4-03f2-f0a3af4bf2ad
                    name: 'ipsum ut '
      tags:
        - ZapEHR Project API
        - developer
        - '{id}'
      description: >-
        Get the Developer with the provided ID. Developer accounts are used to
        log into the [Developer Console](https://console.oystehr.com/) and
        administrate [Projects](https://docs.oystehr.com/services/project/).
        [Developers](https://docs.oystehr.com/services/iam/developers/) are the
        only people who can belong to and act across multiple Projects, because
        they exist above the Project level.


        Access Policy Action: `IAM:GetDeveloper`

        Access Policy Resource: `IAM:Developer`
    parameters:
      - name: id
        in: path
        required: true
        description: (Required) ID of the developer
        schema:
          type: string
        example: <uuid>
    patch:
      summary: Update a developer
      parameters:
        - name: x-zapehr-project-id
          in: header
          schema:
            type: string
          example: '{{projectId}}'
      responses:
        '200':
          description: Developer Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  email:
                    type: string
                  profile:
                    type: string
                  roles:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uri
                        name:
                          type: string
              example:
                id: 259da33d-bd01-6501-4d94-871e18d09690
                name: ea in mollit enim in
                email: consequat sit irure non
                profile: do
                roles:
                  - id: urn:uuid:77be89e5-07c2-5be6-1500-397a3151c649
                    name: labore nostrud ex consequat anim
                  - id: 0a903a67-e96f-15b6-e67a-22d28eb0f585
                    name: labore deserunt qui do
      tags:
        - ZapEHR Project API
        - developer
        - '{id}'
      description: >-
        Update the Developer with the provided ID. Developer accounts are used
        to log into the [Developer Console](https://console.oystehr.com/) and
        administrate [Projects](https://docs.oystehr.com/services/project/).
        [Developers](https://docs.oystehr.com/services/iam/developers/) are the
        only people who can belong to and act across multiple Projects, because
        they exist above the Project level.


        Access Policy Action: `IAM:UpdateDeveloper`

        Access Policy Resource: `IAM:Developer`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                roles:
                  type: array
                  items:
                    type: string
                accessPolicy:
                  type: object
                  properties:
                    rule:
                      type: array
                      items:
                        type: object
                        properties:
                          resource:
                            type: array
                            items:
                              type: string
                          action:
                            type: array
                            items:
                              type: string
                          effect:
                            type: string
            example:
              roles:
                - <uuid>
                - <uuid>
              accessPolicy:
                rule:
                  - resource:
                      - <string>
                      - <string>
                    action:
                      - <string>
                      - <string>
                    effect: <string>
                  - resource:
                      - <string>
                      - <string>
                    action:
                      - <string>
                      - <string>
                    effect: <string>
    delete:
      summary: Remove a developer
      parameters:
        - name: x-zapehr-project-id
          in: header
          schema:
            type: string
          example: '{{projectId}}'
      responses:
        '204':
          description: Developer removed from the project
      tags:
        - ZapEHR Project API
        - developer
        - '{id}'
      description: >-
        Remove the Developer with the provided ID from the project. Developer
        accounts are used to log into the [Developer
        Console](https://console.oystehr.com/) and administrate
        [Projects](https://docs.oystehr.com/services/project/).
        [Developers](https://docs.oystehr.com/services/iam/developers/) are the
        only people who can belong to and act across multiple Projects, because
        they exist above the Project level.


        Access Policy Action: `IAM:RemoveDeveloper`

        Access Policy Resource: `IAM:Developer`
  /developer:
    get:
      summary: Get all developers
      parameters:
        - name: x-zapehr-project-id
          in: header
          schema:
            type: string
          example: '{{projectId}}'
      responses:
        '200':
          description: List of all developers in the project
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
              example:
                - id: 4124ad27-59d3-4502-9290-b7ff8008300c
                  name: mollit laborum velit
                - id: e3a7b19a-860e-bcf0-b6a9-24e44133d5e3
