openapi: 3.1.0
info:
  title: ZapEHR API
  version: 1.0.0
  description: Postman collection for the ZapEHR API
servers:
  - url: '{{projectBaseUrl}}'
  - url: '{{fhirBaseUrl}}'
paths:
  /application/{id}:
    delete:
      summary: Delete an application
      parameters:
        - name: x-zapehr-project-id
          in: header
          schema:
            type: string
          example: '{{projectId}}'
      responses:
        '204':
          description: Application deleted
      tags:
        - ZapEHR Project API
        - application
        - '{id}'
      description: >-
        Delete the Application with the provided ID.
        [Applications](https://docs.oystehr.com/services/app/applications/)
        provide authentication in front of the web and mobile apps you build on
        Oystehr.


        Access Policy Action: `App:DeleteApplication`

        Access Policy Resource: `App:Application`
    parameters:
      - name: id
        in: path
        required: true
        description: (Required) ID of the application
        schema:
          type: string
        example: <uuid>
    get:
      summary: Get an application
      parameters:
        - name: x-zapehr-project-id
          in: header
          schema:
            type: string
          example: '{{projectId}}'
      responses:
        '200':
          description: Get a project application details
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientId:
                    type: string
                    format: uri
                  id:
                    type: string
                    format: uri
                  name:
                    type: string
                  description:
                    type: string
                  loginRedirectUri:
                    type: string
                  loginWithEmailEnabled:
                    type: boolean
                  allowedCallbackUrls:
                    type: array
                    items:
                      type: string
                  allowedLogoutUrls:
                    type: array
                    items:
                      type: string
                  allowedWebOriginsUrls:
                    type: array
                    items:
                      type: string
                  allowedCORSOriginsUrls:
                    type: array
                    items:
                      type: string
                  passwordlessSMS:
                    type: boolean
                  mfaEnabled:
                    type: boolean
                  shouldSendInviteEmail:
                    type: boolean
                  logoUri:
                    type: string
                  refreshTokenEnabled:
                    type: boolean
              example:
                clientId: urn:uuid:328a121c-d572-4552-49d8-78facdb0f7c2
                id: urn:uuid:1bc45711-b5f5-0f6f-2517-f0bdd6834414
                name: sint ut
                description: in consectetur ad
                loginRedirectUri: occaecat nostrud
                loginWithEmailEnabled: false
                allowedCallbackUrls:
                  - eu cillum officia
                  - mollit incididunt dolor velit in
                allowedLogoutUrls:
                  - cupidatat
                  - velit dolor cillum deserunt
                allowedWebOriginsUrls:
                  - sint in
                  - minim esse voluptate ipsum
                allowedCORSOriginsUrls:
                  - aliquip velit
                  - deserunt dolore magna ullamco
                passwordlessSMS: true
                mfaEnabled: false
                shouldSendInviteEmail: true
                logoUri: magna aliqua esse
                refreshTokenEnabled: true
      tags:
        - ZapEHR Project API
        - application
        - '{id}'
      description: >-
        Get the Application with the provided ID.
        [Applications](https://docs.oystehr.com/services/app/applications/)
        provide authentication in front of the web and mobile apps you build on
        Oystehr.


        Access Policy Action: `App:GetApplication`

        Access Policy Resource: `App:Application`
    patch:
      summary: Update an application
      parameters:
        - name: x-zapehr-project-id
          in: header
          schema:
            type: string
          example: '{{projectId}}'
      responses:
        '200':
          description: Application Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientId:
                    type: string
                    format: uri
                  id:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  loginRedirectUri:
                    type: string
                  loginWithEmailEnabled:
                    type: string
                  allowedCallbackUrls:
                    type: array
                    items:
                      type: string
                  allowedLogoutUrls:
                    type: array
                    items:
                      type: string
                  allowedWebOriginsUrls:
                    type: array
                    items:
                      type: string
                  allowedCORSOriginsUrls:
                    type: array
                    items:
                      type: string
                  passwordlessSMS:
                    type: string
                  mfaEnabled:
                    type: string
                  shouldSendInviteEmail:
                    type: string
                  logoUri:
                    type: string
                  refreshTokenEnabled:
                    type: string
              example:
                clientId: urn:uuid:6ea03f26-dbe4-f4a3-4e45-856a33ab9a95
                id: 63d8c851-a167-d110-a75a-cac604fb45b6
                name: <string>
                description: <string>
                loginRedirectUri: <url>
                loginWithEmailEnabled: <boolean>
                allowedCallbackUrls:
                  - <url>
                  - <url>
                allowedLogoutUrls:
                  - <url>
                  - <url>
                allowedWebOriginsUrls:
                  - <url>
                  - <url>
                allowedCORSOriginsUrls:
                  - <url>
                  - <url>
                passwordlessSMS: <boolean>
                mfaEnabled: <boolean>
                shouldSendInviteEmail: <boolean>
                logoUri: <url>
                refreshTokenEnabled: <boolean>
      tags:
        - ZapEHR Project API
        - application
        - '{id}'
      description: >-
        Update the Application with the provided ID.
        [Applications](https://docs.oystehr.com/services/app/applications/)
        provide authentication in front of the web and mobile apps you build on
        Oystehr.


        Access Policy Action: `App:UpdateApplication`

        Access Policy Resource: `App:Application`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                loginRedirectUri:
                  type: string
                loginWithEmailEnabled:
                  type: string
                allowedCallbackUrls:
                  type: array
                  items:
                    type: string
                allowedLogoutUrls:
                  type: array
                  items:
                    type: string
                allowedWebOriginsUrls:
                  type: array
                  items:
                    type: string
                allowedCORSOriginsUrls:
                  type: array
                  items:
                    type: string
                passwordlessSMS:
                  type: string
                mfaEnabled:
                  type: string
                shouldSendInviteEmail:
                  type: string
                logoUri:
                  type: string
                refreshTokenEnabled:
                  type: string
            example:
              name: <string>
              description: <string>
              loginRedirectUri: <url>
              loginWithEmailEnabled: <boolean>
              allowedCallbackUrls:
                - <url>
                - <url>
              allowedLogoutUrls:
                - <url>
                - <url>
              allowedWebOriginsUrls:
                - <url>
                - <url>
              allowedCORSOriginsUrls:
                - <url>
                - <url>
              passwordlessSMS: <boolean>
              mfaEnabled: <boolean>
              shouldSendInviteEmail: <boolean>
              logoUri: <url>
              refreshTokenEnabled: <boolean>
  /application/{id}/rotate-secret:
    post:
      summary: Rotate application's secret
      parameters:
        - name: x-zapehr-project-id
          in: header
          schema:
            type: string
          example: '{{projectId}}'
      responses:
        '200':
          description: Application's secret rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
              example:
                secret: dolor anim
      tags:
        - ZapEHR Project API
        - application
        - '{id}'
      description: |-
        Rotate client's secrete associated with an application.

        Access Policy Action: `App:RotateApplicationSecret`
        Access Policy Resource: `App:Application`
    parameters:
      - name: id
        in: path
        required: true
        description: (Required) ID of the application
        schema:
          type: string
        example: <uuid>
  /application/{id}/revoke-refresh-token:
    post:
      summary: Revokes user's refresh token
      parameters:
        - name: x-zapehr-project-id
          in: header
          schema:
            type: string
          example: '{{projectId}}'
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: nostrud
      tags:
        - ZapEHR Project API
        - application
        - '{id}'
      description: |-
        Revokes user's refresh token issued for the application.

        Access Policy Action: `App:RevokeRefreshToken`
        Access Policy Resource: `App:Application`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
            example:
              token: <string>
    parameters:
      - name: id
        in: path
        required: true
        description: (Required) ID of the application
        schema:
          type: string
        example: <uuid>
  /application/{id}/revoke-access-token:
    post:
      summary: Revokes user's access token
      parameters:
        - name: x-zapehr-project-id
          in: header
          schema:
            type: string
          example: '{{projectId}}'
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: nostrud
      tags:
        - ZapEHR Project API
        - application
        - '{id}'
      description: |-
        Revokes user's access token issued for the application.

        Access Policy Action: `App:RevokeAccessToken`
        Access Policy Resource: `App:Application`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
            example:
              token: <string>
    parameters:
      - name: id
        in: path
        required: true
        description: (Required) ID of the application
        schema:
          type: string
        example: <uuid>
  /application:
    get:
      summary: Get applications
      parameters:
        - name: x-zapehr-project-id
          in: header
          schema:
            type: string
          example: '{{projectId}}'
      responses:
        '200':
          description: List of applications in the project
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    clientId:
                      type: string
                    id:
                      type: string
                    name:
                      type: string
                    description:
                      type: string
              example:
                - clientId: 9b4a2ec0-7aa1-bf27-33a0-089950657d44
                  id: 1e3320a5-5485-f2bd-4742-14f28460b047
