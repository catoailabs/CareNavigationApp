      responses:
        '200':
          description: M2M Client
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uri
                  name:
                    type: string
                  clientId:
                    type: string
                  profile:
                    type: string
                  roles:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
