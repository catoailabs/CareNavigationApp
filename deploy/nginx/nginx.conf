# Production reverse proxy for the self-hosted Care Navigation app.
# Mirrors the dev proxy in vite.config.ts:
#   /api/chat|settings|catalog|google  -> agent backend (FastAPI/uvicorn :8000)
#   /api/chrome-tabs                   -> virtual-desktop Chromium CDP /json
#   /api/chrome-ws/*                   -> virtual-desktop Chromium CDP websockets
#   everything else                    -> the SPA (index.html fallback)
#
# Upstreams are resolved at request time via Docker's embedded DNS (127.0.0.11)
# so nginx starts even if a backend is briefly unavailable and survives
# container IP changes on restart.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow image / PDF uploads through the chat endpoint.
    client_max_body_size 25m;

    # Docker embedded DNS — enables runtime resolution of service names.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Lightweight liveness endpoint for the container healthcheck.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # --- Virtual desktop: Chromium DevTools Protocol (tab bridge) ---
    # Chrome enforces a DNS-rebinding guard on its /json + websocket endpoints,
    # rejecting any Host header that is not localhost/an IP literal. We send
    # `Host: localhost:9222` so the returned webSocketDebuggerUrl keeps the exact
    # `ws://localhost:9222` prefix that src/services/tabService.ts rewrites.
    location = /api/chrome-tabs {
        set $cdp_upstream "agent-desktop:9222";
        proxy_pass http://$cdp_upstream/json;
        proxy_set_header Host localhost:9222;
        proxy_connect_timeout 3s;
    }

    location /api/chrome-ws/ {
        set $cdp_upstream "agent-desktop:9222";
        rewrite ^/api/chrome-ws/(.*)$ /$1 break;
        proxy_pass http://$cdp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host localhost:9222;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Agent backend (chat + settings + catalog + google) ---
    # proxy_buffering off keeps the AI SDK SSE stream flowing token-by-token.
    location /api/ {
        set $agent_upstream "agent:8000";
        proxy_pass http://$agent_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
